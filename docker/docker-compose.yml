services:
  wa-expense-tracker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: wa-expense-tracker
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # Session WhatsApp (Baileys) — HARUS persist, kalau tidak QR harus discan ulang tiap redeploy
      - wa-auth-session:/app/auth_session
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wa-auth-session:
